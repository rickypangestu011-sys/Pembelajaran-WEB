<html>
    <head>
        <title>
            Belajar JavaScript Platform
        </title>
    </head>
    <body>
        <h1>Tipe Data Pada JavaScript</h1>
        <div id="hasilangka"></div>
        <div id="hasilkalimat"></div>
        <div id="hasilhewan"></div>
        <div id="hasilmanusia"></div>
        
        <script>
            var angka = 80;
            var kalimat = "ayo belajar javascript";
            var hewan = ["Kambing", "Bebek", "Ayam"];
            var manusia = {
                nama : "Budi",
                alamat : "Yogyakarta",
                umur : 20,
                pekerjaan : "Mahasiswa"
            };

            document.getElementById("hasilangka").innerHTML = hasilangka;
            document.getElementById("hasilkalimat").innerHTML = hasilkalimat;
            document.getElementById("hasilhewan").innerHTML = hasilhewan;
            document.getElementById("hasilmanusia").innerHTML = manusia.nama + "tinggal di" +
            manusia.alamat + "dia sekarang berumur" + manusia.umur + "dan bekerja sebagai" + manusia.pekerjaan;
        </script>
    </body>
</html>
